name: Build Windows EXE (with icon)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install PyPDF2 python-docx

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE (with icon support)
        run: |
          if (Test-Path "app/icon.ico") {
            pyinstaller --onefile --windowed --icon=app/icon.ico --name=pdf_extractor_fulltext app/gui.py
          } else {
            pyinstaller --onefile --windowed --name=pdf_extractor_fulltext app/gui.py
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf_extractor_fulltext_windows_exe
          path: dist/pdf_extractor_fulltext.exe
